<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>التوصيل | سديم</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">سديم</a>
      <nav>
        <a href="/index.html">الرئيسية</a>
        <a href="/services.html">الخدمات</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <h1>طلب توصيل</h1>
    <form class="form">
      <label>الاسم<input type="text" required /></label>
      <label>الهاتف<input type="text" required /></label>
      <label>العنوان<textarea required></textarea></label>
      <label>نوع الخدمة
        <select>
          <option>توصيل سريع</option>
          <option>خدمة ميدانية</option>
          <option>حلول شركات</option>
        </select>
      </label>
      <button class="btn primary" type="submit">إرسال الطلب</button>
    </form>

    <div class="track-box">
      <h2>تتبع الطلب</h2>
      <input id="trackId" type="text" placeholder="أدخل رقم التتبع" />
      <button id="trackBtn" class="btn secondary">تتبع</button>
      <p id="trackResult"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 سديم</p>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>
</html>
